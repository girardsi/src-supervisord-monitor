name: Build and Push Docker Image to GHCR

env:
  # Remplacer 'nom-de-l-image' par le nom de votre projet
  IMAGE_WITH_TAG: ghcr.io/${{ github.repository_owner }}/src-supervisord-monitor:${{ github.run_number }}
  LATEST_IMAGE: ghcr.io/${{ github.repository_owner }}/src-supervisord-monitor:latest

on:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest
    
    # INDISPENSABLE : donne les droits à GitHub Actions de pousser un package
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        
      - name: Create .env file for frontend
        run: echo "VITE_API_URL='/api'" > assets/.env
        
      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3
        
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
        
      - name: Login to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
          
      - name: Build and Push Docker Image (multi-arch)
        run: |
          # Convertir les tags en minuscules pour respecter les règles de Docker
          IMAGE_TAG_LOWER=$(echo "${{ env.IMAGE_WITH_TAG }}" | tr '[:upper:]' '[:lower:]')
          IMAGE_LATEST_LOWER=$(echo "${{ env.LATEST_IMAGE }}" | tr '[:upper:]' '[:lower:]')
          
          docker buildx build \
            --platform linux/amd64,linux/arm64 \
            --push \
            -t $IMAGE_TAG_LOWER \
            -t $IMAGE_LATEST_LOWER \
            .
